# Konfigurasi Standby Host Pasif (PRD v5 Epic 4)
# Perhatian: Host standby HANYA dinyalakan setelah host utama dipastikan MATI total.

services:
  lavalink-standby:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: music-bot-lavalink-standby
    restart: "no"
    environment:
      - _JAVA_OPTIONS=-Xmx1G
    volumes:
      - ../../application.yml:/opt/Lavalink/application.yml
      - ../../plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"

  bot-standby:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    container_name: music-bot-app-standby
    restart: "no"
    depends_on:
      - lavalink-standby
    env_file:
      - ../../.env
    environment:
      - LAVALINK_HOST=lavalink-standby
      - LAVALINK_PORT=2333
    volumes:
      - ../../data:/app/data
      - ../../backups:/app/backups
    ports:
      - "127.0.0.1:3000:3000"
